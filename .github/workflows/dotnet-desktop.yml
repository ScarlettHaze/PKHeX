name: .NET Core Desktop

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: your-solution-name
      Wap_Project_Directory: your-wap-project-directory-name
      Wap_Project_Path: your-wap-project-path

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Test
        run: dotnet test

      - name: Restore
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=Release

      - name: Decode signing certificate
        run: |
          $pfx = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
          $certificatePath = Join-Path $env:Wap_Project_Directory GitHubActionsWorkflow.pfx
          [IO.File]::WriteAllBytes($certificatePath, $pfx)

      - name: Build MSIX
        run: >
          msbuild $env:Wap_Project_Path
          /p:Configuration=Release
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxBundle=Always
          /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx
          /p:PackageCertificatePassword=${{ secrets.Pfx_Key }}

      - name: Remove certificate
        run: Remove-Item "$env:Wap_Project_Directory\GitHubActionsWorkflow.pfx"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.Wap_Project_Directory }}/AppPackages/**/*.msix
            ${{ env.Wap_Project_Directory }}/AppPackages/**/*.msixbundle
            ${{ env.Wap_Project_Directory }}/AppPackages/**/*.appxbundle
            ${{ env.Wap_Project_Directory }}/AppPackages/**/*.msixupload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
